{%load static%}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHostel login</title>
    <link rel="stylesheet" href="{% static 'hostel/signup.css' %}">

</head>

<body>

    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">SmartHostel</div>
            <ul class="nav-links">
                <li><a href="{% url 'home' %}">Dashboard</a></li>
                <li><a href="{% url 'Roomsinfo' %}">Rooms Info</a></li>
                <li><a href="{% url 'home' %}">Notices</a></li>
                <li><a href="{% url 'signup' %}">Student</a></li>
            </ul>
        </div>
    </nav>

    <div class="wrapper">
        <div class="title-text">
            <div class="title login">Student</div>
            <div class="title signup">Student</div>
        </div>

        {% if messages %}
        {% for message in messages %}
        <p style="color:red">{{message}}</p>
        {% endfor %}
        {% endif %} 

        <div class="form-container">
            <div class="slide-controls">
                <input type="radio" name="slide" id="login" checked>
                <input type="radio" name="slide" id="signup">
                <label for="login" class="slide login">Login</label>
                <label for="signup" class="slide signup">Signup</label>
                <div class="slider-tab"></div>
            </div>
            <div class="form-inner">
                <form action="{% url 'login' %}" class="login" method="post">
                    <div class="field">
                        <input type="text" placeholder="Email Address"  name="email"required>
                    </div>
                    <div class="field">
                        <input type="password" placeholder="Password" name="password" required>
                    </div>
                    <div class="pass-link"><a href="#">Forgot password?</a></div>
                    <div class="field btn">
                        <div class="btn-layer"></div>
                        <input type="submit" value="Login">
                    </div>
                    <div class="signup-link">Not a member? <a href="">Signup now</a></div>
                </form>
                <form action="{% url 'signup' %}" class="signup" method="post">
                    <div class="field">
                        <input type="text" placeholder="Email Address" name="email" required>
                    </div>
                    <div class="field">
                        <input type="password" placeholder="Password" name="password" required>
                    </div>
                    <div class="field">
                        <input type="password" placeholder="Confirm password" name="confirm_password" required>
                    </div>
                    <div class="field">
                        <input type="name" placeholder="full name" name="name" required>
                    </div>
                    <div class="field btn">
                        <div class="btn-layer"></div>
                        <input type="submit" value="Signup">
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="{%static 'hostel/js/signup.js' %}"></script>

</body>

</html>
